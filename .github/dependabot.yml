version: 2
updates:
  - package-ecosystem: mix
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # A bump would run the new commit with the auto-merge workflow's write token.
      - dependency-name: dependabot/fetch-metadata
    groups:
      actions:
        patterns: ['*']
